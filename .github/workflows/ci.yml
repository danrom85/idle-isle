name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macOS 15 runners ship Xcode 16+, required for Swift tools version 6.0.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test
