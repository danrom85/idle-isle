<!DOCTYPE html>
<html><head><style>
  body { margin: 0; background: #FF00FF; }
  .sheet { display: inline-block; background: #FF00FF; line-height: 0; }
</style></head><body>
  <div class="sheet" id="fronds"></div>
  <div class="sheet" id="trunk"></div>
  <script>
    fetch('palm_fronds.svg').then(r => r.text()).then(t => {
      document.getElementById('fronds').innerHTML = t;
      return fetch('palm_trunk.svg');
    }).then(t => {
      document.getElementById('trunk').innerHTML = t;
      document.title = 'READY';
    });
  </script>
</body></html>
